<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WatchMovieTo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <main class="stage" id="stage">
      <div class="stage-top">
        <span class="logo">WatchMovieTo</span>
        <span id="status">Bağlanıyor...</span>
        <select id="movieSelect" class="movie-select">
          <option value="">Film seç...</option>
        </select>
      </div>
      <video id="player" controls playsinline></video>
      <div class="empty">Başlamak için bir film seç</div>
    </main>

    <aside class="side">
      <div class="tile" id="remoteTile">
        <video id="remoteVideo" autoplay playsinline></video>
        <div class="tile-label">Arkadaşın</div>
        <div class="badges" id="remoteBadges"></div>
        <div class="placeholder"></div>
      </div>

      <div class="tile" id="localTile">
        <video id="localVideo" autoplay playsinline muted></video>
        <div class="tile-label">Sen</div>
        <div class="placeholder"></div>
        <div class="tile-controls">
          <button id="camBtn" class="round" title="Kamerayı aç/kapat">📷</button>
          <button id="micBtn" class="round" title="Mikrofonu aç/kapat">🎤</button>
        </div>
      </div>
    </aside>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
